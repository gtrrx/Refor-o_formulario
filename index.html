<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Formulario</title>
</head>

<body>
    <h2 style="text-align: center;">Formulário de Cadastro</h2>

    <div class="formulario">

        <form action="/enviar-dados" method="post">

            <fieldset>
                <legend>Dados de Login</legend>
                <div class="grid-login">
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="xxx.xxx.xxx-xx" required>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="campo">
                        <label for="email-confirm">Confirmar</label>
                        <input type="email" id="email-confirm" name="email-confirm" required>
                    </div>
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required>
                    </div>
                    <div class="campo">
                        <label for="senha-confirm">Confirmar</label>
                        <input type="password" id="senha-confirm" name="senha-confirm" required>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Dados de Contato</legend>
                <div class="grid-contato">
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="campo">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome">
                    </div>
                    <div class="campo">
                        <label for="nascimento">Nascimento</label>
                        <input type="text" id="nascimento" name="nascimento" placeholder="dd/mm/aaaa">
                    </div>
                    <div class="campo">
                        <label for="rg">RG</label>
                        <input type="text" id="rg" name="rg">
                    </div>
                    <div class="campo">
                        <label for="sexo">Sexo</label>
                        <select id="sexo" name="sexo">
                            <option value="">Selecione</option>
                            <option value="feminino">Feminino</option>
                            <option value="masculino">Masculino</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep">
                    </div>
                    <div class="campo endereco">
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" name="endereco">
                    </div>
                    <div class="campo">
                        <label for="numero">Nº</label>
                        <input type="text" id="numero" name="numero">
                    </div>
                    <div class="campo">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro">
                    </div>
                    <div class="campo">
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento" name="complemento">
                    </div>
                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade">
                    </div>
                    <div class="campo">
                        <label for="estado">Estado</label>
                        <select id="estado" name="estado">
                            <option value="">Selecione</option>
                            <option value="SP">SP</option>
                            <option value="RJ">RJ</option>
                            <option value="MG">MG</option>
                            <!-- Adicione os outros estados -->
                        </select>
                    </div>
                    <div class="campo">
                        <label for="telefone">DDD + Telefone</label>
                        <input type="text" id="telefone" name="telefone">
                    </div>
                    <div class="campo">
                        <label for="celular">DDD + Celular</label>
                        <input type="text" id="celular" name="celular">
                    </div>
                </div>
            </fieldset>

            <div class="botoes">
                <input type="submit" value="Enviar">
            </div>
        </form>
    </div>
</body>

</html>
